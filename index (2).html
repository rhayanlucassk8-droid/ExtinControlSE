        function LogsView() {
            const { logs } = useContext(AppContext);
            return (
                <div className="glass-card max-w-4xl mx-auto flex flex-col h-full absolute inset-4 sm:inset-6 animate-fadeIn">
                    <div className="p-4 border-b border-slate-200 bg-slate-50 rounded-t-xl shrink-0">
                        <h2 className="text-base font-bold text-slate-800 flex items-center gap-2"><LucideIcon name="activity" className="w-5 h-5 text-red-500"/> Registro de Atividades</h2>
                    </div>
                    <div className="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3 bg-white rounded-b-xl">
                        {logs.map(log => (
                            <div key={log.id} className="flex gap-4 p-3 bg-slate-50 rounded-lg border border-slate-100 hover:border-slate-200 transition-colors">
                                <div className="mt-0.5"><LucideIcon name={log.tipo === 'VISTORIA' ? 'check-square' : log.tipo === 'OPERACAO' ? 'tool' : 'info'} className="w-4 h-4 text-slate-400" /></div>
                                <div><p className="text-sm font-medium text-slate-700">{log.descricao}</p><p className="text-[10px] font-bold text-slate-400 mt-1 uppercase">{new Date(log.data).toLocaleString('pt-BR')}</p></div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ValidadeBadge({ data }) {
            if(!data) return <span className="text-red-500 font-bold text-xs bg-red-50 px-2 py-1 rounded">INVÁLIDO</span>;
            const hoje = new Date(), venc = new Date(data);
            const diff = Math.ceil((venc - hoje) / (1000 * 60 * 60 * 24));
            const formatada = `${data.split('-')[2]}/${data.split('-')[1]}/${data.split('-')[0]}`;
            
            if(diff < 0) return <span className="inline-block bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold border border-red-200">{formatada} (VENCIDO)</span>;
            if(diff <= 30) return <span className="inline-block bg-orange-100 text-orange-700 px-2 py-0.5 rounded text-xs font-bold border border-orange-200">{formatada} (ALERTA)</span>;
            return <span className="inline-block bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs font-medium border border-slate-200">{formatada}</span>;
        }

        function StatusBadge({ status, type }) {
            const styles = {
                OPERACIONAL: 'bg-emerald-100 text-emerald-700 border-emerald-200',
                DISPONIVEL: 'bg-emerald-100 text-emerald-700 border-emerald-200',
                INSTALADO: 'bg-red-100 text-red-700 border-red-200',
                MANUTENCAO: 'bg-orange-100 text-orange-700 border-orange-200',
                default: 'bg-slate-100 text-slate-600 border-slate-200'
            };
            const css = styles[status] || styles.default;
            return <span className={`px-2 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wider ${css}`}>{status}</span>;
        }

        function ModalsManager() {
            const { modalState, closeModal, veiculos, setVeiculos, extintores, setExtintores, actions, notify, addLog } = useContext(AppContext);
            if (!modalState.type) return null;

            const Overlay = ({ children }) => (
                <div className="fixed inset-0 bg-slate-900/40 z-50 flex items-center justify-center p-4 modal-overlay" onClick={(e) => e.target === e.currentTarget && closeModal()}>
                    {children}
                </div>
            );

            // Modal Troca
            if (modalState.type === 'TROCA_EXTINTOR') {
                const { veiculo, currExt } = modalState.data;
                return (
                    <Overlay>
                        <ModalTroca veiculo={veiculo} currExt={currExt} extintores={extintores} onClose={closeModal} onSave={actions.trocarExtintor} />
                    </Overlay>
                );
            }

            // Modal Veiculo
            if (modalState.type === 'VEICULO') {
                return (
                    <Overlay>
                        <FormVeiculo data={modalState.data} onClose={closeModal} onSave={(v) => {
                            if(modalState.data) { setVeiculos(veiculos.map(x => x.id === v.id ? v : x)); addLog(`Veículo ${v.placa} atualizado.`); }
                            else { setVeiculos([{...v, id: 'v'+Date.now()}, ...veiculos]); addLog(`Veículo ${v.placa} criado.`); }
                            notify('Veículo salvo!'); closeModal();
                        }} />
                    </Overlay>
                );
            }

            // Modal Extintor
            if (modalState.type === 'EXTINTOR') {
                return (
                    <Overlay>
                        <FormExtintor data={modalState.data} onClose={closeModal} onSave={(e) => {
                            if(modalState.data) { setExtintores(extintores.map(x => x.id === e.id ? e : x)); addLog(`Extintor ${e.numExtintor} atualizado.`); }
                            else { setExtintores([{...e, id: 'e'+Date.now()}, ...extintores]); addLog(`Extintor ${e.numExtintor} criado.`); }
                            notify('Extintor salvo!'); closeModal();
                        }} />
                    </Overlay>
                );
            }

            // Modal Recarga
            if (modalState.type === 'RECARGA') {
                return (
                    <Overlay>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm modal-content overflow-hidden">
                            <div className="p-5 border-b border-slate-100 bg-slate-50"><h2 className="text-lg font-bold">Retorno de Recarga</h2></div>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const novaData = e.target.data.value;
                                setExtintores(extintores.map(x => x.id === modalState.data.id ? {...x, vencimento: novaData, status: 'DISPONIVEL'} : x));
                                addLog(`Extintor ${modalState.data.numExtintor} recarregado.`); notify('Recarga concluída!'); closeModal();
                            }}>
                                <div className="p-5">
                                    <label className="text-sm font-bold text-slate-700 block mb-2">Nova Data de Validade</label>
                                    <input type="date" required name="data" className="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-red-500" />
                                </div>
                                <div className="p-4 border-t bg-slate-50 flex justify-end gap-2">
                                    <button type="button" onClick={closeModal} className="px-4 py-2 text-slate-600 font-medium">Cancelar</button>
                                    <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold">Concluir</button>
                                </div>
                            </form>
                        </div>
                    </Overlay>
                );
            }

            // Modal Confirma Exclusão
            if (modalState.type === 'CONFIRMA_EXCLUSAO') {
                const veiculo = modalState.data;
                return (
                    <Overlay>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm modal-content overflow-hidden text-center p-6">
                            <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4"><LucideIcon name="alert-triangle" className="w-8 h-8" /></div>
                            <h2 className="text-xl font-black text-slate-800 mb-2">Excluir Veículo?</h2>
                            <p className="text-sm text-slate-500 mb-6">Tem certeza que deseja excluir permanentemente o veículo <br/><b className="text-slate-800">{veiculo.placa} (PFX: {veiculo.prefixo})</b>?<br/><br/>O histórico de vistorias associado a ele também será apagado. Esta ação <b>não pode ser desfeita</b>.</p>
                            <div className="flex gap-3">
                                <button onClick={closeModal} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">Cancelar</button>
                                <button onClick={() => actions.excluirVeiculo(veiculo.id)} className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition-colors">Sim, Excluir</button>
                            </div>
                        </div>
                    </Overlay>
                );
            }

            // Modal Confirma Exclusão de Inspeção
            if (modalState.type === 'CONFIRMA_EXCLUSAO_INSPECAO') {
                const insp = modalState.data;
                return (
                    <Overlay>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm modal-content overflow-hidden text-center p-6">
                            <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4"><LucideIcon name="trash-2" className="w-8 h-8" /></div>
                            <h2 className="text-xl font-black text-slate-800 mb-2">Apagar Lançamento?</h2>
                            <p className="text-sm text-slate-500 mb-6">Tem certeza que deseja apagar o registro do veículo <b className="text-slate-800">{insp.prefixo}</b> realizado em {new Date(insp.data).toLocaleString('pt-BR')}?<br/><br/>Esta ação é definitiva.</p>
                            <div className="flex gap-3">
                                <button onClick={closeModal} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">Cancelar</button>
                                <button onClick={() => actions.excluirInspecao(insp.id)} className="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition-colors">Sim, Apagar</button>
                            </div>
                        </div>
                    </Overlay>
                );
            }

            // Modal Autenticar Exportação
            if (modalState.type === 'AUTENTICAR_EXPORTACAO') {
                return (
                    <Overlay>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md modal-content overflow-hidden">
                            <div className="p-5 border-b border-slate-100 bg-slate-900 text-white flex items-center gap-2"><LucideIcon name="shield-check" className="w-5 h-5 text-red-400" /><h2 className="text-lg font-bold">Autenticação de Relatório</h2></div>
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                actions.exportarVistoriasAutenticadas(e.target.auditor.value);
                            }}>
                                <div className="p-6 space-y-4">
                                    <p className="text-sm text-slate-600">Para garantir a validade jurídica/operacional na auditoria, insira seu nome e matrícula. O arquivo gerado conterá uma chave de autenticação (Hash) irrevogável.</p>
                                    <div>
                                        <label className="text-sm font-bold text-slate-700 block mb-2">Nome e Matrícula do Auditor</label>
                                        <input type="text" required name="auditor" autoFocus placeholder="Ex: João Silva - Mat: 12345" className="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all" />
                                    </div>
                                </div>
                                <div className="p-4 border-t bg-slate-50 flex justify-end gap-3">
                                    <button type="button" onClick={closeModal} className="px-4 py-2 text-slate-600 font-bold hover:bg-slate-200 rounded-lg transition-colors">Cancelar</button>
                                    <button type="submit" className="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold shadow-md transition-all flex items-center gap-2"><LucideIcon name="download" className="w-4 h-4" /> Assinar e Exportar</button>
                                </div>
                            </form>
                        </div>
                    </Overlay>
                );
            }

            // Modal Visualizar Foto
            if (modalState.type === 'VISUALIZAR_FOTO') {
                return (
                    <Overlay>
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg modal-content overflow-hidden flex flex-col">
                            <div className="p-4 border-b border-slate-100 bg-slate-900 flex justify-between items-center text-white">
                                <h2 className="text-lg font-bold flex items-center gap-2"><LucideIcon name="image" className="w-5 h-5" /> Evidência Fotográfica</h2>
                                <button onClick={closeModal} className="text-slate-400 hover:text-white transition-colors"><LucideIcon name="x" className="w-6 h-6" /></button>
                            </div>
                            <div className="bg-slate-100 p-2 flex justify-center items-center">
                                <img src={modalState.data} alt="Evidência" className="max-h-[60vh] object-contain rounded-lg shadow-sm" />
                            </div>
                            <div className="p-4 bg-white flex justify-end">
                                <button onClick={closeModal} className="px-6 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-900 transition-colors">Fechar</button>
                            </div>
                        </div>
                    </Overlay>
                );
            }

            return null;
        }

        // Formulários extraídos para organizar o ModalsManager
        function ModalTroca({ veiculo, currExt, extintores, onClose, onSave }) {
            const [acaoAntigo, setAcaoAntigo] = useState('MANUTENCAO');
            const [novoExtId, setNovoExtId] = useState('');
            const disponiveis = extintores.filter(e => e.status === 'DISPONIVEL' && e.cr === veiculo.cr && e.vencimento && new Date(e.vencimento) >= new Date());

            return (
                <form onSubmit={e => { e.preventDefault(); onSave(veiculo.id, currExt?.id, acaoAntigo, novoExtId); }} className="bg-white rounded-2xl shadow-2xl w-full max-w-lg modal-content overflow-hidden">
                    <div className="p-5 border-b border-slate-100 bg-slate-50"><h2 className="text-lg font-bold text-slate-800">Troca de Equipamento</h2></div>
                    <div className="p-5 space-y-5">
                        <div className="p-3 bg-red-50 border border-red-100 rounded-lg text-sm text-red-800 font-bold flex items-center gap-2"><LucideIcon name="truck" className="w-5 h-5" /> {veiculo.placa} ({veiculo.cr})</div>
                        {currExt && (
                            <div className="space-y-2">
                                <label className="text-sm font-bold text-slate-700">Ação para o atual (Nº {currExt.numExtintor})</label>
                                <select value={acaoAntigo} onChange={e => setAcaoAntigo(e.target.value)} className="w-full px-3 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-red-500">
                                    <option value="MANUTENCAO">Enviar para Manutenção/Recarga</option><option value="DISPONIVEL">Retornar ao Estoque</option><option value="INUTILIZADO">Descartar (Sucata)</option>
                                </select>
                            </div>
                        )}
                        <div className="space-y-2">
                            <label className="text-sm font-bold text-slate-700">Novo Extintor a Instalar</label>
                            {disponiveis.length === 0 ? (<div className="text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-100 font-medium">Nenhum extintor válido no estoque deste CR.</div>) : (
                                <select required value={novoExtId} onChange={e => setNovoExtId(e.target.value)} className="w-full px-3 py-2.5 border border-slate-300 rounded-lg outline-none focus:border-red-500">
                                    <option value="" disabled>Selecione no estoque...</option>
                                    {disponiveis.map(e => (<option key={e.id} value={e.id}>Nº {e.numExtintor} - Val: {e.vencimento.split('-').reverse().join('/')}</option>))}
                                </select>
                            )}
                        </div>
                    </div>
                    <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3"><button type="button" onClick={onClose} className="px-4 py-2 text-slate-600 font-medium">Cancelar</button><button type="submit" disabled={!novoExtId && disponiveis.length > 0} className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg disabled:opacity-50">Confirmar</button></div>
                </form>
            );
        }

        function FormVeiculo({ data, onClose, onSave }) {
            const [form, setForm] = useState(data || { prefixo: '', placa: '', tipoFrota: 'CONVENCIONAL', cr: CRS[0], status: 'OPERACIONAL', extintorId: null, usaExtintor: true });
            const handleChange = e => setForm({...form, [e.target.name]: e.target.name === 'usaExtintor' ? e.target.value === 'true' : e.target.value.toUpperCase()});
            return (
                <form onSubmit={e => { e.preventDefault(); onSave(form); }} className="bg-white rounded-2xl shadow-2xl w-full max-w-md modal-content overflow-hidden">
                    <div className="p-5 border-b font-bold text-lg bg-slate-50">{data ? 'Editar Veículo' : 'Novo Veículo'}</div>
                    <div className="p-5 space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-sm font-bold text-slate-700 mb-1 block">Placa</label><input required name="placa" value={form.placa} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" /></div>
                            <div><label className="text-sm font-bold text-slate-700 mb-1 block">Prefixo</label><input required name="prefixo" value={form.prefixo} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-sm font-bold text-slate-700 mb-1 block">Tipo de Frota</label><input required name="tipoFrota" value={form.tipoFrota} onChange={handleChange} placeholder="Ex: ONIBUS, VAN" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" /></div>
                            <div><label className="text-sm font-bold text-slate-700 mb-1 block">Exige Extintor?</label><select name="usaExtintor" value={form.usaExtintor !== false ? 'true' : 'false'} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none"><option value="true">SIM</option><option value="false">NÃO (N/A)</option></select></div>
                        </div>
                        <div><label className="text-sm font-bold text-slate-700 mb-1 block">Status</label><select name="status" value={form.status} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none"><option value="OPERACIONAL">OPERACIONAL</option><option value="DESATIVADO">DESATIVADO</option></select></div>
                        <div><label className="text-sm font-bold text-slate-700 mb-1 block">Base (CR)</label><select name="cr" value={form.cr} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" disabled={!!data}>{CRS.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                    </div>
                    <div className="p-4 border-t flex justify-end gap-2 bg-slate-50"><button type="button" onClick={onClose} className="px-4 py-2 font-medium text-slate-600">Cancelar</button><button type="submit" className="px-5 py-2 bg-red-600 text-white font-bold rounded-lg">Salvar</button></div>
                </form>
            );
        }

        function FormExtintor({ data, onClose, onSave }) {
            const [form, setForm] = useState(data || { numExtintor: '', numCilindro: '', tipo: 'ABC', peso: '4KG', vencimento: '', status: 'DISPONIVEL', cr: CRS[0] });
            const handleChange = e => setForm({...form, [e.target.name]: e.target.value.toUpperCase()});
            return (
                <form onSubmit={e => { e.preventDefault(); onSave(form); }} className="bg-white rounded-2xl shadow-2xl w-full max-w-lg modal-content overflow-hidden">
                    <div className="p-5 border-b font-bold text-lg bg-slate-50">{data ? 'Editar Extintor' : 'Novo Extintor'}</div>
                    <div className="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div><label className="text-sm font-bold text-slate-700 mb-1 block">Nº Patrimônio</label><input required name="numExtintor" value={form.numExtintor} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" /></div>
                        <div><label className="text-sm font-bold text-slate-700 mb-1 block">Nº Cilindro (Opcional)</label><input name="numCilindro" value={form.numCilindro} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" /></div>
                        <div><label className="text-sm font-bold text-slate-700 mb-1 block">Tipo</label><select name="tipo" value={form.tipo} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none"><option>ABC</option><option>BC</option><option>CO2</option><option>AGUA</option></select></div>
                        <div><label className="text-sm font-bold text-slate-700 mb-1 block">Peso</label><select name="peso" value={form.peso} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none"><option>4KG</option><option>6KG</option><option>8KG</option><option>12KG</option></select></div>
                        <div className="sm:col-span-2"><label className="text-sm font-bold text-slate-700 mb-1 block">Validade</label><input type="date" required name="vencimento" value={form.vencimento} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" /></div>
                        
                        <div className="sm:col-span-2">
                            <label className="text-sm font-bold text-slate-700 mb-1 block">Status Manual</label>
                            <select name="status" value={form.status} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" disabled={form.status === 'INSTALADO'}>
                                <option value="DISPONIVEL">ESTOQUE (DISPONÍVEL)</option><option value="MANUTENCAO">EM MANUTENÇÃO</option><option value="INUTILIZADO">INUTILIZADO / SUCATA</option>
                                {form.status === 'INSTALADO' && <option value="INSTALADO" disabled>INSTALADO EM VEÍCULO</option>}
                            </select>
                        </div>
                        <div className="sm:col-span-2"><label className="text-sm font-bold text-slate-700 mb-1 block">Base (CR)</label><select name="cr" value={form.cr} onChange={handleChange} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:border-red-500 outline-none" disabled={form.status === 'INSTALADO'}>{CRS.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                    </div>
                    <div className="p-4 border-t flex justify-end gap-2 bg-slate-50"><button type="button" onClick={onClose} className="px-4 py-2 font-medium text-slate-600">Cancelar</button><button type="submit" className="px-5 py-2 bg-red-600 text-white font-bold rounded-lg">Salvar</button></div>
                </form>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><Layout /></AppProvider>);
    </script>
</body>
</html>
